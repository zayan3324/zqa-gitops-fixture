apiVersion: apps/v1
kind: Deployment
metadata:
  name: zqa-web
  namespace: zqa-gitops
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: zqa-web
  template:
    metadata:
      labels:
        app: zqa-web
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine-zqa-does-not-exist
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
